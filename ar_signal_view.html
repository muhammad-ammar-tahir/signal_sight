<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SignalSight - AR View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(19, 24, 33, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid #1E2532;
        }
        .signal-bubble {
            box-shadow: 0 0 20px rgba(0, 224, 255, 0.3);
            border: 1px solid rgba(0, 224, 255, 0.5);
        }
        .ai-accent {
            border-top: 2px solid #A855F7;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#f0dbff",
                        "on-secondary": "#490080",
                        "secondary-container": "#6f00be",
                        "on-surface": "#dce4e6",
                        "on-primary-container": "#005f6d",
                        "on-tertiary-fixed-variant": "#5b4300",
                        "on-tertiary-container": "#6f5200",
                        "surface-container": "#1a2123",
                        "primary-container": "#00e0ff",
                        "on-primary-fixed": "#001f25",
                        "secondary-fixed-dim": "#ddb7ff",
                        "on-secondary-fixed-variant": "#6900b3",
                        "on-primary-fixed-variant": "#004e5a",
                        "surface": "#0d1516",
                        "tertiary-fixed-dim": "#f7be27",
                        "error": "#ffb4ab",
                        "surface-bright": "#333a3c",
                        "on-secondary-container": "#d6a9ff",
                        "tertiary-fixed": "#ffdf9d",
                        "on-error": "#690005",
                        "inverse-on-surface": "#2a3233",
                        "surface-container-lowest": "#080f11",
                        "on-tertiary": "#3f2e00",
                        "surface-tint": "#00daf8",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#00daf8",
                        "on-tertiary-fixed": "#251a00",
                        "on-secondary-fixed": "#2c0051",
                        "surface-container-low": "#161d1f",
                        "primary-fixed": "#a5eeff",
                        "outline": "#859397",
                        "on-background": "#dce4e6",
                        "tertiary-container": "#fec42e",
                        "surface-dim": "#0d1516",
                        "on-primary": "#00363f",
                        "surface-variant": "#2f3638",
                        "primary": "#baf2ff",
                        "tertiary": "#ffe6b6",
                        "surface-container-high": "#242b2d",
                        "background": "#0d1516",
                        "surface-container-highest": "#2f3638",
                        "on-surface-variant": "#bac9cd",
                        "outline-variant": "#3b494c",
                        "secondary": "#ddb7ff",
                        "inverse-primary": "#006877",
                        "inverse-surface": "#dce4e6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "data-mono": ["monospace"],
                        "label-tech": ["Inter"],
                        "headline-md": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "body-base": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-base overflow-hidden h-screen w-screen">
<!-- AR Camera Feed Background -->
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover opacity-60 grayscale-[0.5]" data-alt="A first-person perspective camera feed of a high-tech modern office interior with glass walls and minimalist furniture. The scene is filtered with a slight tech-blue tint and subtle digital noise. The lighting is cold and professional, reflecting a futuristic sci-fi aesthetic. Visible depth and perspective suggest an augmented reality environment ready for data overlay." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUvJDBOXZim7EOMG_4sFCIHw8Wce0I8TfRZrS0UquWeIXOp2AiNbOJ1SgVc3nhQXOYCRVqdYDKGSRgRK7J_vxZ0u80olFFPYpNvVS3s4jdIG92Whb0oLwp7qQUg7wSOfRfDjeoWnSZ24fb41xp6IvNpz1A3VXQ7-cccZ19KW3PpCLmvaLOGlZ_stBMwVkMWwneeN9Yixxf6I5MZgMuXI7GsteVXR1ryIuB5DhlmgIKOwGeyE91oyztfVT6ONK6Z0ZUACTeVaocYdc"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-transparent to-surface/80"></div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-10 h-full flex flex-col pointer-events-none">
<!-- TopAppBar (Shared Component Mapping) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-5 h-16 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/50 shadow-[0_0_15px_rgba(0,224,255,0.1)] pointer-events-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-cyan-400">menu</span>
<span class="text-xl font-black tracking-tighter text-cyan-400 uppercase font-['Space_Grotesk']">SignalSight</span>
</div>
<div class="flex items-center gap-3">
<div class="flex flex-col items-end">
<span class="font-data-mono text-[10px] text-cyan-400 tracking-widest uppercase">AR Signal Calibration: ACTIVE</span>
<span class="text-[9px] text-slate-500 font-data-mono">SYNC_ERR: 0.002ms</span>
</div>
<span class="material-symbols-outlined text-cyan-400">sensors</span>
</div>
</header>
<!-- AR Canvas / Signal Bubbles (Floating) -->
<main class="flex-grow relative overflow-hidden">
<!-- Bubble 1: Strong Signal -->
<div class="absolute top-[25%] left-[20%] pointer-events-auto group">
<div class="w-24 h-24 rounded-full glass-panel border-cyan-400/60 flex flex-col items-center justify-center signal-bubble bg-cyan-400/10 animate-pulse">
<span class="font-data-mono text-cyan-400 text-[12px] font-bold">-42 dBm</span>
<span class="font-label-tech text-[8px] text-cyan-400/70">DIST: 2.1m</span>
</div>
<div class="mt-2 w-px h-12 bg-gradient-to-b from-cyan-400 to-transparent mx-auto"></div>
</div>
<!-- Bubble 2: Medium Signal -->
<div class="absolute top-[45%] right-[15%] pointer-events-auto group">
<div class="w-16 h-16 rounded-full glass-panel border-secondary-container/60 flex flex-col items-center justify-center signal-bubble bg-secondary-container/10">
<span class="font-data-mono text-secondary-container text-[10px] font-bold">-68 dBm</span>
<span class="font-label-tech text-[8px] text-secondary-container/70">DIST: 5.4m</span>
</div>
<div class="mt-2 w-px h-12 bg-gradient-to-b from-secondary-container to-transparent mx-auto"></div>
</div>
<!-- Bubble 3: Weak/AI Identified -->
<div class="absolute bottom-[40%] left-[45%] pointer-events-auto group">
<div class="w-12 h-12 rounded-full glass-panel border-on-tertiary-container/60 flex flex-col items-center justify-center signal-bubble bg-tertiary-container/10 ai-accent">
<span class="font-data-mono text-on-tertiary-container text-[8px] font-bold">-89 dBm</span>
<span class="font-label-tech text-[6px] text-on-tertiary-container/70">DIST: 12.8m</span>
</div>
<div class="mt-2 w-px h-8 bg-gradient-to-b from-tertiary-container to-transparent mx-auto"></div>
</div>
<!-- Central HUD Crosshair -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center opacity-40">
<div class="w-48 h-48 border border-cyan-400/20 rounded-full flex items-center justify-center">
<div class="w-32 h-32 border border-cyan-400/40 rounded-full flex items-center justify-center border-dashed">
<span class="material-symbols-outlined text-cyan-400 text-4xl">adjust</span>
</div>
</div>
</div>
</main>
<!-- Bottom Sheet Panel -->
<section class="pointer-events-auto mb-20 px-5">
<div class="glass-panel w-full rounded-xl p-5 shadow-2xl space-y-4">
<div class="flex justify-between items-center border-b border-slate-800 pb-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-cyan-400" data-weight="fill">target</span>
<div>
<h3 class="font-headline-md text-sm uppercase tracking-wider text-cyan-400">Signal Lock-on</h3>
<p class="font-label-tech text-[10px] text-slate-500">TARGETING: 5GHz_WLAN_04</p>
</div>
</div>
<div class="flex gap-1">
<div class="w-1 h-4 bg-primary-container rounded-full"></div>
<div class="w-1 h-6 bg-primary-container rounded-full"></div>
<div class="w-1 h-3 bg-primary-container rounded-full"></div>
<div class="w-1 h-5 bg-primary-container rounded-full"></div>
</div>
</div>
<div class="h-16 w-full flex items-end gap-1 px-2">
<!-- Real-time Signal Graph -->
<div class="flex-grow h-full relative overflow-hidden rounded bg-slate-900/50 flex items-end gap-[2px] p-2">
<div class="flex-1 bg-cyan-400/40 h-[60%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/50 h-[80%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/30 h-[40%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/60 h-[90%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/40 h-[55%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/70 h-[95%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/50 h-[70%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/40 h-[60%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/50 h-[85%] rounded-t-sm"></div>
<div class="flex-1 bg-cyan-400/30 h-[45%] rounded-t-sm"></div>
</div>
<button class="bg-primary-container text-on-primary-container h-16 px-4 rounded-lg flex flex-col items-center justify-center hover:bg-cyan-300 transition-colors">
<span class="material-symbols-outlined">gps_fixed</span>
<span class="font-label-tech text-[8px] mt-1">LOCK</span>
</button>
</div>
</div>
</section>
<!-- BottomNavBar (Shared Component Mapping) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-6 pt-3 h-20 bg-[#131821]/90 backdrop-blur-2xl border-t border-slate-800 shadow-[0_-4px_20px_rgba(0,0,0,0.5)] pointer-events-auto">
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2">
<span class="material-symbols-outlined">wifi_tethering</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Heatmap</span>
</div>
<div class="flex flex-col items-center justify-center text-cyan-400 drop-shadow-[0_0_10px_rgba(0,224,255,0.5)] scale-110 p-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">AR View</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2">
<span class="material-symbols-outlined">router</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Devices</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2">
<span class="material-symbols-outlined">psychology</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Advisor</span>
</div>
</nav>
</div>
</body></html>
