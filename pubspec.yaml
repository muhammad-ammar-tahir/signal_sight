name: signalsight
description: "WiFi Signal Intelligence System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  sqflite: ^2.2.8
  path_provider: ^2.1.1
  shared_preferences: ^2.2.1
  permission_handler: ^11.0.1
  sensors_plus: ^6.0.1
  connectivity_plus: ^5.0.2
  fl_chart: ^0.63.0
  image_picker: ^1.0.4
  share_plus: ^7.2.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  flutter_svg: ^2.0.9
  csv: ^5.0.1
  collection: ^1.18.0
  shimmer: ^3.0.0
  intl: ^0.18.1
  path: ^1.8.3
  arcore_flutter_plugin: ^0.1.0
  vector_math: ^2.2.0
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.3
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/oui.csv
