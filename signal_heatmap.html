<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0d1516;
            margin: 0;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(19, 24, 33, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid #1E2532;
        }
        .heatmap-gradient {
            background: radial-gradient(circle at 40% 40%, rgba(0, 224, 255, 0.15) 0%, rgba(0, 224, 255, 0) 50%),
                        radial-gradient(circle at 70% 60%, rgba(254, 196, 46, 0.1) 0%, rgba(254, 196, 46, 0) 40%),
                        radial-gradient(circle at 20% 80%, rgba(147, 0, 10, 0.1) 0%, rgba(147, 0, 10, 0) 30%);
        }
        .dotted-grid {
            background-image: radial-gradient(#1E2532 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#f0dbff",
                        "on-secondary": "#490080",
                        "secondary-container": "#6f00be",
                        "on-surface": "#dce4e6",
                        "on-primary-container": "#005f6d",
                        "on-tertiary-fixed-variant": "#5b4300",
                        "on-tertiary-container": "#6f5200",
                        "surface-container": "#1a2123",
                        "primary-container": "#00e0ff",
                        "on-primary-fixed": "#001f25",
                        "secondary-fixed-dim": "#ddb7ff",
                        "on-secondary-fixed-variant": "#6900b3",
                        "on-primary-fixed-variant": "#004e5a",
                        "surface": "#0d1516",
                        "tertiary-fixed-dim": "#f7be27",
                        "error": "#ffb4ab",
                        "surface-bright": "#333a3c",
                        "on-secondary-container": "#d6a9ff",
                        "tertiary-fixed": "#ffdf9d",
                        "on-error": "#690005",
                        "inverse-on-surface": "#2a3233",
                        "surface-container-lowest": "#080f11",
                        "on-tertiary": "#3f2e00",
                        "surface-tint": "#00daf8",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#00daf8",
                        "on-tertiary-fixed": "#251a00",
                        "on-secondary-fixed": "#2c0051",
                        "surface-container-low": "#161d1f",
                        "primary-fixed": "#a5eeff",
                        "outline": "#859397",
                        "on-background": "#dce4e6",
                        "tertiary-container": "#fec42e",
                        "surface-dim": "#0d1516",
                        "on-primary": "#00363f",
                        "surface-variant": "#2f3638",
                        "primary": "#baf2ff",
                        "tertiary": "#ffe6b6",
                        "surface-container-high": "#242b2d",
                        "background": "#0d1516",
                        "surface-container-highest": "#2f3638",
                        "on-surface-variant": "#bac9cd",
                        "outline-variant": "#3b494c",
                        "secondary": "#ddb7ff",
                        "inverse-primary": "#006877",
                        "inverse-surface": "#dce4e6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin": "20px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "unit": "4px",
                        "stack-lg": "32px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "data-mono": ["monospace"],
                        "label-tech": ["Inter"],
                        "headline-md": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "body-base": ["Inter"]
                    },
                    "fontSize": {
                        "data-mono": ["14px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "label-tech": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "display-lg": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-base": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-base text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-5 h-16 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/50 shadow-[0_0_15px_rgba(0,224,255,0.1)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-cyan-400">menu</span>
<h1 class="text-xl font-black tracking-tighter text-cyan-400 uppercase font-['Space_Grotesk']">SignalSight</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-cyan-400">sensors</span>
</div>
</header>
<!-- Main Canvas Area -->
<main class="relative w-full h-screen overflow-hidden pt-16 pb-20 dotted-grid">
<!-- Floor Plan Background -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20 mix-blend-screen px-margin">
<img class="w-full h-full object-contain filter invert hue-rotate-180" data-alt="A highly detailed architectural blueprint of a modern open-plan office layout with clean white technical lines on a deep navy-black background. The floor plan shows workstations, corridors, and server rooms in a specialized technical drawing style. The lighting is low and moody, emphasizing a futuristic surveillance aesthetic. Subtle digital artifacts and grid lines intersect the blueprint to create a high-stakes tactical dashboard environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC92tQ7hxz4OaK3rc-FDyEZkfOrFZKNw8y6ZTh3zZYuiIchFNn5h-wOlqd_b4HGGEgHq2WGZ2-rI3hT_7f6emKwA893Es3e1-FZa2PR_OL4bm3eO4ZNOKfxdAIhx-mMYtqwsz3X9RAGFzvYNEQMt22FvGPHsk8l07oizkSY2DMZkdvAq5UEFcdNDiXXvjL8tKsLIstWkA_76R8j-cQ42N6d3YMN1XOY_Sqe3sxDPEA3mv7y3MrrWzpaW1Bw3cA0yT12-u45COqkT_o"/>
</div>
<!-- Heatmap Overlay -->
<div class="absolute inset-0 heatmap-gradient pointer-events-none opacity-60"></div>
<!-- SVG Signal Path Overlay -->
<svg class="absolute inset-0 w-full h-full" xmlns="http://www.w3.org/2000/svg">
<path class="opacity-80" d="M 100 400 L 250 350 L 400 450 L 550 300 L 700 380 L 850 320" fill="none" stroke="#00e0ff" stroke-dasharray="8,8" stroke-width="2"></path>
<!-- Signal Strength Nodes -->
<circle class="drop-shadow-[0_0_8px_#10b981]" cx="100" cy="400" fill="#10b981" r="6"></circle>
<circle class="drop-shadow-[0_0_8px_#10b981]" cx="250" cy="350" fill="#10b981" r="6"></circle>
<circle class="drop-shadow-[0_0_8px_#f59e0b]" cx="400" cy="450" fill="#f59e0b" r="6"></circle>
<circle class="drop-shadow-[0_0_8px_#ef4444]" cx="550" cy="300" fill="#ef4444" r="6"></circle>
<circle class="drop-shadow-[0_0_8px_#f59e0b]" cx="700" cy="380" fill="#f59e0b" r="6"></circle>
<circle class="drop-shadow-[0_0_8px_#10b981]" cx="850" cy="320" fill="#10b981" r="6"></circle>
</svg>
<!-- Info Panel (Bottom Left) -->
<div class="absolute bottom-24 left-5 glass-card p-4 rounded-xl flex flex-col gap-2 min-w-[160px] shadow-2xl">
<div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-1">
<span class="text-label-tech font-label-tech text-slate-500">SESSION DATA</span>
<span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
</div>
<div class="flex flex-col">
<span class="text-data-mono font-data-mono text-cyan-400">Steps: 124</span>
<span class="text-data-mono font-data-mono text-cyan-400">Area: 45 m²</span>
</div>
<div class="mt-2 flex gap-1">
<div class="h-1 flex-1 bg-cyan-400/20 rounded-full overflow-hidden">
<div class="h-full bg-cyan-400 w-3/4"></div>
</div>
</div>
</div>
<!-- Floating Action Button (Bottom Right) -->
<button class="fixed bottom-28 right-5 px-6 py-3 bg-cyan-400 text-slate-950 font-bold rounded-full flex items-center gap-2 shadow-[0_0_20px_rgba(0,224,255,0.4)] active:scale-95 transition-transform">
<span class="material-symbols-outlined">stop_circle</span>
<span class="font-['Space_Grotesk'] tracking-wide">Stop &amp; Analyze</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-6 pt-3 h-20 bg-[#131821]/90 backdrop-blur-2xl border-t border-slate-800 shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
<!-- Dashboard -->
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2 cursor-pointer">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Dashboard</span>
</div>
<!-- Heatmap (ACTIVE) -->
<div class="flex flex-col items-center justify-center text-cyan-400 drop-shadow-[0_0_10px_rgba(0,224,255,0.5)] scale-110 p-2 cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">wifi_tethering</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Heatmap</span>
</div>
<!-- AR View -->
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2 cursor-pointer">
<span class="material-symbols-outlined">view_in_ar</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">AR View</span>
</div>
<!-- Devices -->
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2 cursor-pointer">
<span class="material-symbols-outlined">router</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Devices</span>
</div>
<!-- Advisor -->
<div class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 rounded-xl transition-all p-2 cursor-pointer">
<span class="material-symbols-outlined">psychology</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest mt-1">Advisor</span>
</div>
</nav>
<!-- Side Map Legend (Optional Technical Decoration) -->
<div class="fixed top-24 right-5 flex flex-col gap-3">
<div class="glass-card p-3 rounded-lg border-l-4 border-l-emerald-500">
<div class="text-[10px] font-bold text-slate-500">OPTIMAL</div>
<div class="text-data-mono text-on-surface">-45 dBm</div>
</div>
<div class="glass-card p-3 rounded-lg border-l-4 border-l-amber-500">
<div class="text-[10px] font-bold text-slate-500">MODERATE</div>
<div class="text-data-mono text-on-surface">-72 dBm</div>
</div>
<div class="glass-card p-3 rounded-lg border-l-4 border-l-rose-500">
<div class="text-[10px] font-bold text-slate-500">CRITICAL</div>
<div class="text-data-mono text-on-surface">-90 dBm</div>
</div>
</div>
</body></html>
