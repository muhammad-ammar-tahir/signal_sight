<body class="min-h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-primary-container selection:text-on-primary-fixed">
<!-- Hero Illustration Section -->
<main class="relative w-full max-w-4xl px-margin flex flex-col items-center text-center">
<!-- Minimalist Line Art Illustration -->
<div class="relative w-full aspect-square max-w-[400px] mb-stack-lg flex items-center justify-center">

<div class="absolute inset-0 flex items-center justify-center">
<div class="signal-rings absolute w-full h-full rounded-full border border-primary-fixed-dim/20"></div>
<div class="signal-rings absolute w-3/4 h-3/4 rounded-full border border-primary-fixed-dim/30" style="animation-delay: 0.5s"></div>
<div class="signal-rings absolute w-1/2 h-1/2 rounded-full border border-primary-fixed-dim/40" style="animation-delay: 1s"></div>
</div>
<!-- Central Signal Core -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-primary-fixed-dim flex items-center justify-center shadow-[0_0_40px_rgba(0,224,255,0.4)]">
<span class="material-symbols-outlined text-on-primary-fixed text-4xl" data-icon="wifi_tethering">wifi_tethering</span>
</div>
<!-- Data Flow Lines -->
<div class="mt-stack-md flex gap-2">
<div class="w-1 h-8 bg-primary-fixed-dim/40 rounded-full"></div>
<div class="w-1 h-12 bg-primary-fixed-dim/60 rounded-full"></div>
<div class="w-1 h-16 bg-primary-fixed-dim rounded-full shadow-[0_0_10px_rgba(0,224,255,0.5)]"></div>
<div class="w-1 h-12 bg-primary-fixed-dim/60 rounded-full"></div>
<div class="w-1 h-8 bg-primary-fixed-dim/40 rounded-full"></div>
</div>
</div>
<!-- Abstract Data Pips -->
<div class="absolute top-0 right-10 flex flex-col items-center gap-1">
<span class="text-[8px] font-data-mono text-primary-fixed-dim uppercase tracking-tighter">Scan Mode</span>
<div class="w-2 h-2 rounded-full bg-primary-fixed-dim animate-pulse"></div>
</div>
</div>
<!-- Text Content -->
<div class="space-y-stack-md max-w-lg">
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tighter">
                Passive Intelligence
            </h1>
<p class="font-body-base text-body-base text-on-surface-variant max-w-sm mx-auto">
                Scan and analyze nearby WiFi networks with zero interference.
            </p>
</div>
<!-- Controls Footer -->
<div class="mt-16 w-full flex flex-col items-center gap-stack-lg">
<!-- Progress Dots -->
<div class="flex gap-3">
<div class="w-8 h-1.5 rounded-full bg-primary-fixed-dim shadow-[0_0_8px_rgba(0,224,255,0.4)]"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-variant"></div>
</div>

<div class="flex flex-col w-full max-w-xs gap-stack-md">
<button class="w-full py-4 rounded-xl border border-primary-fixed-dim text-primary-fixed-dim font-label-tech uppercase transition-all duration-300 hover:bg-primary-fixed-dim/10 hover:shadow-[0_0_20px_rgba(0,224,255,0.2)] active:scale-95">

<button class="w-full py-2 text-on-surface-variant font-label-tech uppercase opacity-60 hover:opacity-100 transition-opacity">
